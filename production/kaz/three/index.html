<!doctype html>
<html><head><meta charset="utf-8"><title>CT scan</title>
<style>html,body{margin:0;background:#0b1010;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1211);
scene.fog = new THREE.Fog(0x0b1211, 7, 16);
const camera = new THREE.PerspectiveCamera(34, W / H, .05, 60);

// ---------- lights
scene.add(new THREE.HemisphereLight(0x9fb8b0, 0x0a0c0b, .35));
const key = new THREE.SpotLight(0xffe6c4, 70, 20, Math.PI / 5, .55, 1.6);
key.position.set(-1.5, 6, 2.5); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -.0004;
scene.add(key); scene.add(key.target);
const rim = new THREE.DirectionalLight(0x5fd0c4, .9); rim.position.set(4, 2, -4); scene.add(rim);

// ---------- floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({color: 0x121a19, roughness: .55, metalness: .2}));
floor.rotation.x = -Math.PI / 2; floor.position.y = -1.0; floor.receiveShadow = true; scene.add(floor);

// ---------- CT gantry: a thick ring with a glowing inner bore
const gantry = new THREE.Group(); scene.add(gantry);
const shell = new THREE.Mesh(new THREE.TorusGeometry(1.55, .62, 48, 128), new THREE.MeshStandardMaterial({color: 0xe9e4d8, roughness: .35, metalness: .05}));
shell.scale.set(1, 1, 1.25); shell.castShadow = true; gantry.add(shell);
const bore = new THREE.Mesh(new THREE.TorusGeometry(1.07, .03, 16, 128), new THREE.MeshBasicMaterial({color: 0x6fe3d4}));
bore.position.z = .5; gantry.add(bore);
const bore2 = bore.clone(); bore2.position.z = -.5; gantry.add(bore2);
const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, .9, 2.0), new THREE.MeshStandardMaterial({color: 0xd9d3c6, roughness: .4}));
base.position.y = -1.9; base.castShadow = true; gantry.add(base);
gantry.position.set(0, 1.3, 0); gantry.rotation.y = Math.PI / 2;     // bore axis along world X

// ---------- table
const table = new THREE.Group(); scene.add(table);
const top = new THREE.Mesh(new THREE.BoxGeometry(4.6, .09, .72), new THREE.MeshStandardMaterial({color: 0x2a3433, roughness: .5, metalness: .3}));
top.castShadow = true; top.receiveShadow = true; table.add(top);
const stand = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.95, .55), new THREE.MeshStandardMaterial({color: 0xcfc9bc, roughness: .45}));
stand.position.set(-3.6, -.02, 0); scene.add(stand);

// ---------- mummy: a lathe profile lying along +X (head toward the gantry)
const prof = [[0,0],[.16,.02],[.18,.12],[.15,.35],[.21,.75],[.19,1.05],[.27,1.35],[.31,1.65],[.29,1.95],[.35,2.3],[.37,2.62],[.30,2.8],[.155,2.93],[.15,3.0],[.205,3.08],[.225,3.2],[.2,3.33],[.12,3.42],[0,3.46]];
const pts = prof.map(([r, y]) => new THREE.Vector2(r, y));
const geo = new THREE.LatheGeometry(pts, 72);
// linen texture: diagonal bandages
const cv = document.createElement('canvas'); cv.width = 512; cv.height = 2048; const g = cv.getContext('2d');
g.fillStyle = '#a8957a'; g.fillRect(0, 0, 512, 2048);
for (let i = -40; i < 140; i++) {
  const y = i * 18; g.save(); g.translate(0, y); g.rotate(i % 2 ? .22 : -.18);
  g.fillStyle = `rgba(${168 + (i * 37) % 30},${150 + (i * 23) % 24},${118 + (i * 11) % 20},.9)`; g.fillRect(-60, 0, 700, 15);
  g.fillStyle = 'rgba(60,42,22,.35)'; g.fillRect(-60, 14, 700, 2); g.restore();
}
for (let k = 0; k < 6000; k++) { g.fillStyle = `rgba(40,28,14,${Math.random() * .12})`; g.fillRect(Math.random() * 512, Math.random() * 2048, 2, 1 + Math.random() * 4); }
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
const linen = new THREE.MeshStandardMaterial({map: tex, roughness: .92, metalness: 0, transparent: true});
const mummy = new THREE.Mesh(geo, linen); mummy.castShadow = true;
// x-ray twin: fresnel glow shell
const xr = new THREE.ShaderMaterial({transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: {o: {value: 0}, c: {value: new THREE.Color(0x8fe8dc)}, scan: {value: -10}},
  vertexShader: `varying vec3 n; varying vec3 v; varying float wx; void main(){ vec4 w = modelMatrix*vec4(position,1.); wx = w.x; n = normalize(normalMatrix*normal); v = normalize(-(viewMatrix*w).xyz); gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform float o; uniform vec3 c; uniform float scan; varying vec3 n; varying vec3 v; varying float wx;
    void main(){ float f = pow(1.-abs(dot(n,v)), 2.2); float lines = .25+.75*step(.5,fract(wx*22.)); float done = step(wx, scan);
      vec3 col = mix(c*.35, c, done); gl_FragColor = vec4(col*(f*1.6+.08)*mix(.6,1.,lines), o); }`});
const ghost = new THREE.Mesh(geo, xr);
const body = new THREE.Group(); body.add(mummy); body.add(ghost);
body.rotation.z = -Math.PI / 2;            // lathe Y -> world +X
body.scale.set(1, 1, .72);                 // flatter front-to-back
body.position.y = .27;
table.add(body);

// ---------- scan plane (red = meaning) and neck ring
const planeMat = new THREE.ShaderMaterial({transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: {o: {value: 0}}, vertexShader: `varying vec2 u; void main(){ u = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform float o; varying vec2 u; void main(){ float r = length(u-.5)*2.; float a = smoothstep(1.,.2,r)*.35 + smoothstep(.03,0.,abs(r-.92))*.9; gl_FragColor = vec4(vec3(.9,.16,.12)*a*o, a*o); }`});
const scanPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), planeMat); scanPlane.rotation.y = Math.PI / 2; scene.add(scanPlane);
const neckRing = new THREE.Mesh(new THREE.TorusGeometry(.2, .012, 12, 96), new THREE.MeshBasicMaterial({color: 0xe0352c, transparent: true, opacity: 0}));
neckRing.rotation.y = Math.PI / 2; scene.add(neckRing);
// dust motes in the light
const dn = 500, dpos = new Float32Array(dn * 3); for (let i = 0; i < dn; i++) { dpos[i*3] = (Math.random()-.5)*8; dpos[i*3+1] = Math.random()*4; dpos[i*3+2] = (Math.random()-.5)*5; }
const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
const dust = new THREE.Points(dg, new THREE.PointsMaterial({color: 0xffe9c8, size: .012, transparent: true, opacity: .55})); scene.add(dust);

// ---------- timeline (seconds, local): 0-6 table slides in; 6-8 switch to x-ray; 8-15 scan sweeps feet->neck; 15-17 push to neck
const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const lerp = (a, b, u) => a + (b - a) * u;
const v3 = (a, b, u) => new THREE.Vector3(lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u));
window.renderAt = (t) => {
  const slide = sm(t / 6.2);
  table.position.set(lerp(-4.2, -1.9, slide), 1.0, 0);
  // head is at local lathe y=3.46 -> world x = table.x + body offset
  const headX = table.position.x + 3.46 - 1.73, feetX = headX - 3.46, neckX = feetX + 2.96;
  body.position.x = -1.73;
  const xray = sm((t - 6.2) / 1.6);
  linen.opacity = 1 - .85 * xray; ghost.material.uniforms.o.value = xray;
  const su = sm((t - 8.0) / 7.0); const sx = lerp(feetX - .1, neckX, su);
  ghost.material.uniforms.scan.value = t > 8 ? sx : -10;
  planeMat.uniforms.o.value = sm((t - 7.8) / .6) * (t < 16.6 ? 1 : .6);
  scanPlane.position.set(sx, 1.0 + .27, 0);
  neckRing.position.set(neckX, 1.0 + .27, 0); neckRing.material.opacity = sm((t - 14.6) / .5); neckRing.scale.setScalar(1 + .25 * Math.sin(Math.max(0, t - 14.6) * 5) * Math.exp(-(t - 14.6)));
  bore.material.color.setHSL(.47, .65, .55 + .15 * Math.sin(t * 4)); bore2.material.color.copy(bore.material.color);
  // camera: three-quarter dolly -> over the body -> push to the neck
  let p, l;
  if (t < 7) { const u = sm(t / 7); p = v3([-6.8, 2.6, 5.2], [-4.6, 2.3, 3.4], u); l = v3([-1.6, 1.6, 0], [-0.8, 1.4, 0], u); }
  else if (t < 15) { const u = sm((t - 7) / 8); p = v3([-4.6, 2.3, 3.4], [-1.6, 3.0, 1.6], u); l = v3([-0.8, 1.4, 0], [sx * .5 + neckX * .5, 1.27, 0], u); }
  else { const u = sm((t - 15) / 2); p = v3([-1.6, 3.0, 1.6], [neckX - .35, 1.75, .55], u); l = v3([neckX - .2, 1.27, 0], [neckX, 1.27, 0], u); }
  camera.position.copy(p); camera.lookAt(l);
  dust.rotation.y = t * .02; dust.position.y = -t * .02;
  key.target.position.set(headX - 1.5, 1, 0);
  renderer.render(scene, camera);
};
window.ready = true;
</script></body></html>
